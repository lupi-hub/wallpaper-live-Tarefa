<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minhas Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Lista de Tarefas</h1>

        <div class="input-area">
            <input type="text" id="tarefaInput" placeholder="Nova tarefa">
            <button onclick="adicionarTarefa()">Adicionar</button>
        </div>

        <ul id="listaTarefas"></ul>

    </div>

    <div class="controls">
    <button onclick="mover('left')">Esquerda</button>
    <button onclick="mover('center')">Centro</button>
    <button onclick="mover('right')">Direita</button>
    </div>

    <div class="progresso-container">
    <div id="barraProgresso"></div>
    </div>

    <p id="textoProgresso">0% concluído</p>

    <script src="script.js"></script>
</body>
</html>
